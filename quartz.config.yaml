# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: The Curse of Strahd
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: curse-of-strahd-woad.vercel.app
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    # Font loading is owned by the `fonts` plugin below (self-hosted). `local` here stops
    # Quartz core from emitting its own (buggy, unencoded) Google Fonts <link>.
    fontOrigin: local
    cdnCaching: true
    typography:
      title: Grenze Gotisch   # blackletter — site masthead only (--titleFont)
      header: Cinzel
      body: EB Garamond
      code: IBM Plex Mono
    colors:
      # Light mode = "the Tome of Strahd": aged parchment, sepia ink, oxblood links
      lightMode:
        light: "#e9e0cc"        # aged parchment background
        lightgray: "#d3c6a8"    # borders, hr, table lines
        gray: "#9a8a6e"         # muted text, graph nodes
        darkgray: "#3b3227"     # body ink (dark sepia)
        dark: "#241c13"         # headers / strong text (near-black brown)
        secondary: "#7c1420"    # links + primary accent (oxblood)
        tertiary: "#8a5a1e"     # hover / secondary accent (dark gold-brown)
        highlight: rgba(124, 20, 32, 0.12)   # internal-link bg, search hover
        textHighlight: "#7c142040"           # ==mark== (oxblood wash)
      # Dark mode = "the Mists of Barovia": near-black, blood crimson, candle-gold
      darkMode:
        light: "#0e0d10"        # near-black background, faint cold purple
        lightgray: "#2a2530"    # borders, hr, table lines
        gray: "#6f6570"         # muted text, graph nodes
        darkgray: "#c7bcc0"     # body text (bone/ash — readable on near-black)
        dark: "#ece3df"         # headers / strong text (pale bone)
        secondary: "#c02b39"    # links + primary accent (blood crimson, tuned for contrast)
        tertiary: "#b3893f"     # hover / secondary accent (tarnished candle-gold)
        highlight: rgba(192, 43, 57, 0.15)   # internal-link bg, search hover
        textHighlight: "#c02b3959"           # ==mark== (blood smear, ~35% alpha)
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      fontOrigin: selfHosted   # download at build → /static/fonts; no runtime dependency on Google
      title: "Grenze Gotisch"
      header: Cinzel
      body: "EB Garamond"
      code: "IBM Plex Mono"
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        showTags: false
      globalGraph:
        showTags: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
